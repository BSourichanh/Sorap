[preset.0]

name="Linux"
platform="Linux"
runnable=true
export_filter="all_resources"
include_filter="linux/*"
exclude_filter="hooks/*, build/*, tests/*, gnome-extension/*, windows/*, docs/*"
export_path="build/sorap.x86_64"

[preset.0.options]

binary_format/embed_pck=true
binary_format/architecture="x86_64"

[preset.1]

name="Windows"
platform="Windows Desktop"
runnable=true
export_filter="all_resources"
include_filter="windows/*"
exclude_filter="hooks/*, build/*, tests/*, gnome-extension/*, linux/*, docs/*"
export_path="build/sorap.exe"

[preset.1.options]

binary_format/embed_pck=true
binary_format/architecture="x86_64"
